name: ci

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release --all-targets
      - run: cargo test --locked --all-targets

  # cargo-{audit,deny,cyclonedx} track current stable rustc; using @stable
  # here is intentional. The MSRV guarantee for the *crate itself* is
  # enforced by the fmt/clippy/test jobs which pin to 1.86.0.
  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-audit
      # RUSTSEC-2023-0071: Marvin Attack on `rsa` 0.9 private-key ops.
      # We use `rsa` only for **public-key signature verification** of
      # RFC 3161 TSA tokens (see deny.toml for the full justification).
      # No constant-time RustCrypto release exists yet; the only
      # alternative is OpenSSL, which we forbid.
      - run: cargo audit --deny warnings --ignore RUSTSEC-2023-0071

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-deny
      - run: cargo deny check

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    needs: [ test ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-cyclonedx
      - run: cargo cyclonedx --format json --override-filename sbom.cdx
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  # --- D-3 evidence generation (temporary, instrumentation-only) ----------
  # Executes the existing chain implementation against the pinned D-3
  # semantic fixture and preserves the raw canonical byte stream as an
  # artifact. Adds no build/test steps to the jobs above.
  d3-evidence:
    name: D-3 chain evidence export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: Swatinem/rust-cache@v2
      - name: Record toolchain provenance
        run: |
          echo "D3_RUST_VERSION=$(rustc --version)" >> "$GITHUB_ENV"
          echo "D3_CARGO_VERSION=$(cargo --version)" >> "$GITHUB_ENV"
      - name: Regression control (chain_hash unchanged by instrumentation)
        run: cargo test --locked --test d3_chain_observability -- --nocapture
      - name: Execute existing chain implementation against the D-3 fixture
        run: cargo run --locked --example d3_chain_export
      - name: Artifact provenance
        run: |
          echo "fixture   $(sha256sum D3_REAL_CHAIN_SEMANTIC_FIXTURE.json)"
          echo "output    $(sha256sum D3_REAL_CHAIN_RUST_OUTPUT.json)"
          echo "canonical $(sha256sum D3_REAL_CHAIN_CANONICAL.bin)"
          echo "canonical bytes: $(wc -c < D3_REAL_CHAIN_CANONICAL.bin)"
      - uses: actions/upload-artifact@v4
        with:
          name: d3-real-chain-rust-output
          path: |
            D3_REAL_CHAIN_RUST_OUTPUT.json
            D3_REAL_CHAIN_CANONICAL.bin
            D3_REAL_CHAIN_SEMANTIC_FIXTURE.json

  # Gate 1: exercise the real HTTP request path under concurrency and verify
  # the resulting JSONL with the independent aura-replay binary.
  concurrency-stress:
    name: GUARD-RS-001 concurrent HTTP stress + replay
    needs: [ test ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: Swatinem/rust-cache@v2
      - name: Build binaries and sign local policies
        run: ./scripts/setup.sh
      - name: Start middleware and stress 500 requests
        shell: bash
        run: |
          set -euo pipefail
          export AURA_API_KEY="$(openssl rand -hex 32)"
          export AURA_SEGMENT_SIZE=0
          export AURA_SEGMENT_INTERVAL_SECONDS=0

          ./target/release/aura-guard > /tmp/aura-guard-stress.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --fail http://127.0.0.1:8080/health >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/aura-guard-stress.log
              echo "Aura-Guard exited before becoming healthy" >&2
              exit 1
            fi
            sleep 0.5
          done
          if [[ "$ready" != "1" ]]; then
            cat /tmp/aura-guard-stress.log
            echo "Aura-Guard did not become healthy" >&2
            exit 1
          fi

          python3 scripts/stress-test.py \
            --base-url http://127.0.0.1:8080 \
            --requests 500 \
            --workers 200 \
            --log logs/audit.jsonl \
            --replay target/release/aura-replay
