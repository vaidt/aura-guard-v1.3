name: coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  coverage:
    name: Rust coverage
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      AURA_SPECIFICATION_ROOT: ${{ github.workspace }}/aura-specification
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned AURA specification fixture
        uses: actions/checkout@v4
        with:
          repository: vaidt/aura-specification
          ref: b3a6e784d9a6ea2e0b554310e3de80e7d13de859
          path: aura-specification
      - uses: dtolnay/rust-toolchain@1.87.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        run: cargo install --locked cargo-llvm-cov
      - name: Generate coverage report
        run: cargo llvm-cov --locked --workspace --all-features --lcov --output-path lcov.info
      - name: Coverage summary
        run: cargo llvm-cov report --summary-only
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
