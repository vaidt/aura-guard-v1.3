name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
permissions:
  contents: read


env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      AURA_SPECIFICATION_ROOT: ${{ github.workspace }}/aura-specification

    steps:
    - uses: actions/checkout@v4
    - name: Checkout pinned AURA specification fixture
      uses: actions/checkout@v4
      with:
        repository: vaidt/aura-specification
        ref: b3a6e784d9a6ea2e0b554310e3de80e7d13de859
        path: aura-specification
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
