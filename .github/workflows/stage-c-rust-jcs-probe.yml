name: Stage C Rust JCS isolated probe

on:
  push:
    branches:
      - "experiment/stage-c-jcs-adapter-20261023"
    paths:
      - "Cargo.toml"
      - "conformance/stage_c_jcs_probe.rs"
      - ".github/workflows/stage-c-rust-jcs-probe.yml"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "conformance/stage_c_jcs_probe.rs"
      - ".github/workflows/stage-c-rust-jcs-probe.yml"

permissions:
  contents: read

jobs:
  rust-jcs-probe:
    name: Rust JCS bytes-only probe (non-normative)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated Rust adapter
        uses: actions/checkout@v4

      - name: Checkout pinned specification fixture
        uses: actions/checkout@v4
        with:
          repository: vaidt/aura-specification
          ref: 991274eed57d5b3308b0607feeb4d01e6a485974
          path: aura-specification

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.86.0

      - name: Run Rust shim tests
        working-directory: aura-specification
        env:
          AURA_SPECIFICATION_ROOT: ${{ github.workspace }}/aura-specification
        run: cargo test --locked --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" --example stage_c_jcs_probe -- --nocapture

      - name: Create invocation request
        working-directory: aura-specification
        shell: bash
        run: |
          mkdir -p artifacts/stage-c/rust-jcs
          rust_commit="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          cat > artifacts/stage-c/rust-jcs/request.json <<EOF
          {
            "schema": "AURA-STAGE-C-ADAPTER-REQUEST/0.1",
            "run_id": "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}",
            "operation": "jcs.canonicalize",
            "fixture_id": "CANONICAL-003",
            "input_path": "fixtures/corpus/CANONICAL-003_jcs_full_discriminator.json",
            "json_pointer": "/protocol_object",
            "source_commit": "$rust_commit"
          }
          EOF

      - name: Execute Rust JCS shim
        working-directory: aura-specification
        env:
          AURA_SPECIFICATION_ROOT: ${{ github.workspace }}/aura-specification
        run: |
          cargo run --locked --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" --example stage_c_jcs_probe -- \
            --request artifacts/stage-c/rust-jcs/request.json \
            --response artifacts/stage-c/rust-jcs/response.json \
            --output-octets artifacts/stage-c/rust-jcs/canonical.bin \
            --repo-root "$GITHUB_WORKSPACE/aura-specification"

      - name: Independently verify exact bytes and digests
        working-directory: aura-specification
        shell: bash
        run: |
          expected='fixtures/corpus/CANONICAL-003_jcs_full_discriminator.expected.jcs'
          actual='artifacts/stage-c/rust-jcs/canonical.bin'
          cmp --silent "$expected" "$actual"
          test "$(wc -c < "$actual" | tr -d ' ')" = "577"
          output_sha="$(sha256sum "$actual" | awk '{print $1}')"
          test "$output_sha" = "9fb648c388c4485575d25c1d6171ba691fec51c1b433b11f4d61197bbe2a5509"
          leaf_sha="$(python -c 'import hashlib, pathlib; print(hashlib.sha256(b"\\x00" + pathlib.Path("artifacts/stage-c/rust-jcs/canonical.bin").read_bytes()).hexdigest())')"
          test "$leaf_sha" = "38672ea2bd0ea87b2446efce8d4ba4adeb822e0baaecee4a54b73179198d2b3e"
          echo "Exact expected-byte comparison: matched"
          echo "Canonical SHA-256: $output_sha"
          echo "RFC 6962 leaf SHA-256 (probe only): $leaf_sha"

      - name: Upload request, response and raw canonical bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-c-rust-jcs-probe
          path: aura-specification/artifacts/stage-c/rust-jcs/
          if-no-files-found: warn
          retention-days: 14
