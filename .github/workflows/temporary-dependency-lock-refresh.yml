name: Temporary dependency lock refresh

on:
  push:
    branches: [ "fix/ci-dependencies" ]

permissions:
  contents: read

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh lockfile for the dependency migration
        run: cargo update -p rustls --precise 0.23.45
      - name: Emit lockfile for review and application
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          value = base64.b64encode(Path("Cargo.lock").read_bytes()).decode("ascii")
          for index in range(0, len(value), 6000):
              chunk = index // 6000
              print(f"LOCKFILE_CHUNK_{chunk:04d}_BEGIN")
              print(value[index:index + 6000])
              print(f"LOCKFILE_CHUNK_{chunk:04d}_END")
          PY
      - name: Validate lockfile and all targets
        run: cargo check --locked --all-targets
