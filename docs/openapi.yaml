openapi: 3.0.3
info:
  title: Aura-Guard Audit API
  version: 1.3.0
  description: Deterministic AI audit middleware with hash-chained evidence log.
  license:
    name: MIT
servers:
  - url: http://127.0.0.1:8080
    description: Local development
paths:
  /v1/audit:
    post:
      summary: Evaluate one AI interaction against a policy pack
      security:
        - apiKey: []
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditRequest'
      responses:
        '200':
          description: Audit entry produced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEntry'
        '400':
          description: Unknown policy_set or invalid body
        '401':
          description: Missing or invalid API key
        '413':
          description: Body exceeds AURA_MAX_BODY_BYTES
        '503':
          description: Audit log halted (fail-closed posture)
  /health:
    get:
      summary: Liveness probe
      responses:
        '200':
          description: Process is up
  /ready:
    get:
      summary: Readiness probe
      responses:
        '200':
          description: Ready to serve audits
        '503':
          description: Audit log halted
  /version:
    get:
      summary: Build metadata
      responses:
        '200':
          description: Service version + genesis hash
  /metrics:
    get:
      summary: Prometheus exposition
      responses:
        '200':
          description: Text exposition format
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
    bearer:
      type: http
      scheme: bearer
  schemas:
    AuditRequest:
      type: object
      required: [context, payload]
      properties:
        context:
          type: string
          example: 'Finance Bot'
        policy_set:
          type: string
          example: 'finance-v1'
        payload:
          type: object
          required: [prompt, response]
          properties:
            prompt: { type: string }
            response: { type: string }
        measurement_input:
          description: Optional fixed-point vector forwarded to the configured AURA Core Python adapter. If omitted, only the existing Rust text-policy engine runs.
          type: object
          required: [vector, valid_schema]
          properties:
            vector:
              type: array
              minItems: 1
              maxItems: 4096
              items: { type: integer, format: int32 }
            valid_schema: { type: boolean }
    AuditEntry:
      type: object
      required: [schema, seq, audit_id, timestamp, decision, policy_set,
                 policy_hash, context, input_hash, shadow_hash, prev_hash,
                 chain_hash, violations]
      properties:
        schema: { type: string, enum: ['aura-guard.audit.v1', 'aura-guard.audit.v2'], example: 'aura-guard.audit.v2' }
        seq: { type: integer, format: int64 }
        audit_id: { type: string, format: uuid }
        timestamp: { type: string, format: date-time }
        decision:
          type: string
          enum: [ALLOW, REVIEW, DENY]
        policy_set: { type: string }
        policy_hash: { type: string, description: 'SHA-256 of the YAML policy bytes' }
        context: { type: string }
        input_hash: { type: string, description: 'SHA-256 of context + prompt + response' }
        shadow_hash: { type: string, description: 'SHA-256 of the SHADOW-normalized input' }
        core_measurement:
          type: object
          required: [status, ari, drift, evaluator_version, measurement_input_hash]
          description: Result or explicit omission/error from the optional AURA Core adapter. This block is part of the v2 chain-hash preimage.
          properties:
            status:
              type: string
              enum: [COMPLETED, OMITTED, ERROR]
            ari: { type: integer, format: int64, nullable: true }
            drift: { type: integer, format: int64, nullable: true }
            evaluator_version: { type: string, example: 'core-v3.3' }
            measurement_input_hash:
              type: string
              nullable: true
              pattern: '^[a-f0-9]{64}
          type: array
          items:
            type: object
            properties:
              rule: { type: string }
              action: { type: string, enum: [allow, review, deny] }
              confidence: { type: number, format: float }
              validator: { type: string, nullable: true }

              description: SHA-256 of compact measurement input JSON; null for OMITTED.
        prev_hash: { type: string }
        chain_hash:
          type: string
          description: SHA-256 of the existing v1 preimage plus a length-prefixed compact core_measurement JSON block for aura-guard.audit.v2.
        violations:
          type: array
          items:
            type: object
            properties:
              rule: { type: string }
              action: { type: string, enum: [allow, review, deny] }
              confidence: { type: number, format: float }
              validator: { type: string, nullable: true }
